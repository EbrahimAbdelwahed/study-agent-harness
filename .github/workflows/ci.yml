name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python -m pip install --disable-pip-version-check build
      - run: python -m build --wheel --sdist --outdir dist
      - run: python -m venv clean-install
      - run: clean-install/bin/python -m pip install --disable-pip-version-check dist/*.whl
      - run: clean-install/bin/study-agent --help
      - run: >-
          clean-install/bin/python -c
          'import importlib.resources;
          assert importlib.resources.files("study_agent").joinpath("py.typed").is_file()'
