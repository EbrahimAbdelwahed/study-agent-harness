name: Verify 0.3.0 release artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check build
      - run: python -m build --wheel --sdist --outdir dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: study-agent-harness-0.3.0
          path: dist/
          if-no-files-found: error

  verify:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: study-agent-harness-0.3.0
          path: dist
      - run: python -m pip install --disable-pip-version-check build pytest mypy ruff
      - run: python scripts/release/check_distribution.py dist
      - run: python scripts/release/check_public_facade.py dist
      - run: python scripts/release/check_side_by_side.py dist
      - run: python -m pytest -q
      - run: python -m ruff check src tests scripts/release
      - run: python -m mypy
      - run: git diff --check
